[package]
name = "haetty-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "haetty daemon: owns sessions, serves frames and events to GUI, CLI and hook clients"

[dependencies]
haetty-cc.workspace = true
haetty-core.workspace = true
haetty-proto.workspace = true
crossbeam-channel.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
haetty-testkit.workspace = true
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

[features]
default = ["ghostty"]
ghostty = ["haetty-core/ghostty", "haetty-proto/ghostty", "haetty-cc/ghostty"]
