[package]
name = "haetty-core"
description = "Terminal backend for haetty: PTY + libghostty-vt engine on its own thread, with a Send-able snapshot API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
haetty-pty.workspace = true
libghostty-vt = { workspace = true, optional = true }
haetty-vt.workspace = true
# Already in the tree (libghostty-vt, winit): the key modifier and kitty flag types.
bitflags = "2"
crossbeam-channel.workspace = true
log.workspace = true

[dev-dependencies]
haetty-testkit.workspace = true

[features]
default = ["ghostty"]
# libghostty-vt, the default engine (needs Zig to build). haetty's own engine
# (haetty-vt) is always there; without this feature it is the only one.
ghostty = ["dep:libghostty-vt"]
# Kept for builds that name it; the native engine needs no feature.
native = []
