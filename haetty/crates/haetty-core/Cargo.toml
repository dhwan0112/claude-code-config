[package]
name = "haetty-core"
description = "Terminal backend for haetty: PTY + libghostty-vt engine on its own thread, with a Send-able snapshot API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
haetty-pty.workspace = true
libghostty-vt.workspace = true
haetty-vt = { workspace = true, optional = true }
crossbeam-channel.workspace = true
log.workspace = true

[dev-dependencies]
haetty-testkit.workspace = true

[features]
# haetty's own engine (DESIGN.md §10): not used by sessions yet.
native = ["dep:haetty-vt"]
