[package]
name = "haetty-gui"
description = "haetty window: winit + softbuffer frontend for a haetty-core session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "haetty"
path = "src/main.rs"

[dependencies]
haetty-core.workspace = true
haetty-proto.workspace = true
haetty-daemon.workspace = true
haetty-cc.workspace = true
log.workspace = true
# X11 and Wayland client libraries are loaded at run time (dlopen), so the
# binary links no windowing library. Wayland window decorations: see
# docs/HANDOFF.md (size trade-off).
winit = { version = "0.30.13", default-features = false, features = [
  "rwh_06",
  "x11",
  "wayland",
  "wayland-dlopen",
  "wayland-csd-adwaita",
] }
softbuffer = { version = "0.4.8", default-features = false, features = [
  "x11",
  "x11-dlopen",
  "wayland",
  "wayland-dlopen",
] }
swash = { version = "0.2.10", default-features = false, features = ["std", "scale", "render"] }
# Font discovery without fontconfig; files are memory-mapped by us.
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "memmap"] }
unicode-width = { version = "0.2", default-features = false }
# Clipboard: Win32; X11 via x11rb (pure Rust); Wayland via smithay-clipboard
# (shares smithay-client-toolkit with winit), libwayland-client dlopen'ed.
copypasta = { version = "0.10.2", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Not used directly: pins copypasta's Wayland clipboard to the release that
# shares smithay-client-toolkit 0.19 with winit 0.30 (0.7.3 pulls in 0.20,
# a second copy of sctk and calloop, +89 KB stripped).
smithay-clipboard = { version = "=0.7.2", default-features = false }

[dev-dependencies]
haetty-testkit.workspace = true
