[workspace]
resolver = "2"
members = [
  "crates/haetty-pty",
  "crates/haetty-core",
  "crates/haetty-proto",
  "crates/haetty-testkit",
  "crates/haetty-cc",
  "crates/haetty-daemon",
  "crates/haetty-headless",
  "crates/haetty-gui",
  "crates/haetty-vt",
  "crates/haetty-vtdiff",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dhwan0112/claude-code-config"
rust-version = "1.90"

[workspace.dependencies]
haetty-pty = { path = "crates/haetty-pty" }
# The engine features (`ghostty`, the default) are each crate's own and
# forward down, so `--no-default-features` leaves libghostty out (DESIGN.md §10.4).
haetty-core = { path = "crates/haetty-core", default-features = false }
haetty-proto = { path = "crates/haetty-proto", default-features = false }
haetty-daemon = { path = "crates/haetty-daemon", default-features = false }
haetty-cc = { path = "crates/haetty-cc", default-features = false }
haetty-testkit = { path = "crates/haetty-testkit" }
haetty-vt = { path = "crates/haetty-vt" }
libghostty-vt = "=0.2.2"
portable-pty = "0.9.0"
crossbeam-channel = "0.5"
log = "0.4"

[profile.release]
debug = 1

# Size-optimised build for shipping: `cargo build --profile dist [--target ...]`.
# `release` keeps debug info for profiling and size analysis (cargo bloat).
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = 0
strip = true

# libghostty-vt-sys picks the Zig optimize mode from its build script's
# environment: DEBUG=true (any debug info) -> Debug; else OPT_LEVEL s/z ->
# ReleaseSmall; else ReleaseFast. Without these two overrides `release`
# (debug info for profiling) and `dev`/`test` (the gate's `cargo test`)
# built the engine in Zig Debug, 200-300x slower than `dist` (T3,
# scripts/zig-mode.sh). Our own crates keep their debug info.
# dist -> ReleaseSmall (what the installers ship), release -> ReleaseFast,
# dev/test -> ReleaseFast.
[profile.release.package.libghostty-vt-sys]
debug = 0

[profile.dev.package.libghostty-vt-sys]
debug = false
