[workspace]
resolver = "2"
members = ["crates/ccterm-pty", "crates/ccterm-core", "crates/ccterm-headless", "crates/ccterm-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dhwan0112/ccterm"
rust-version = "1.90"

[workspace.dependencies]
ccterm-pty = { path = "crates/ccterm-pty" }
ccterm-core = { path = "crates/ccterm-core" }
libghostty-vt = "=0.2.2"
portable-pty = "0.9.0"
crossbeam-channel = "0.5"
log = "0.4"

[profile.release]
debug = 1
