# tmux config for the ccx server only (tmux -L cc -f ~/.claude/cc-panel/tmux.conf).
# Does not affect the default tmux server or ~/.tmux.conf.

# Prefix C-a; press C-a twice to send a literal C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g escape-time 10
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g automatic-rename off
set -g focus-events on
# Terminal title: "ccx · <active tab>" (nested in another tmux, that tmux sees it as the pane title)
set -g set-titles on
set -g set-titles-string "ccx · #W"

# Tabs on top
set -g status-position top
set -g status-interval 2
set -g status-style "bg=colour236,fg=colour248"
set -g status-left "#[bg=colour31,fg=colour255,bold] ccx #[default] "
set -g status-left-length 12
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=colour254,fg=colour235,bold] #I #W #[default]"
set -g window-status-separator "#[fg=colour240]│#[default]"
set -g status-right "#[fg=colour244]C-a: c new · C new in… · S safe · n/p tab · z zoom · d diff · w save size · ←↑↓→ size · hjkl pane · D detach "
set -g status-right-length 120
# Default status-format[0] of tmux 3.4 with two click ranges right after the tab list:
# "+" (user range ccxnew, new tab like C-a c) and "safe" (ccxsafe, new tab with ccx --safe).
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist norange default] #[range=user|ccxnew bg=colour31,fg=colour255,bold] + #[norange default] #[range=user|ccxsafe fg=colour244,underscore]safe#[norange default]#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"

# New tab = new Claude Code session in the current pane's directory (bypass mode; CCX_SAFE= so a server
# started with CCX_SAFE=1 does not pass safe mode on to every C-a c tab)
bind c run-shell -b "cd '#{pane_current_path}' && CCX_SAFE= CCX_SOCKET=#{b:socket_path} CCX_NO_ATTACH=1 CCX_SELECT=1 '#{@ccx_bin}' >/dev/null 2>&1"
# C-a C: ask for a folder (default: the current pane's), open a tab there. The answer goes through a server
# option, not a shell command line ('%%' keeps ~, spaces and quotes as typed; tmux stores $ as \$, newtab.sh
# turns it back).
bind C command-prompt -p "ccx folder:" -I "#{pane_current_path}" { set -s @ccx_newdir '%%' ; run-shell -b "#{@ccx_home}/newtab.sh '#{b:socket_path}' '' --from-option" }
# C-a S: new tab in the current pane's directory with ccx --safe (no bypass default)
bind S run-shell -b "#{@ccx_home}/newtab.sh '#{b:socket_path}' '#{pane_current_path}' --safe"
# Mouse on the top bar: "+" = new tab (like C-a c), "safe" = new --safe tab; repeated clicks within 1.5 s
# open one tab. Anywhere else keeps the tmux default (select the clicked tab).
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},ccxnew}" { run-shell -b "#{@ccx_home}/newtab.sh '#{b:socket_path}' '#{pane_current_path}' --once" } { if -F "#{==:#{mouse_status_range},ccxsafe}" { run-shell -b "#{@ccx_home}/newtab.sh '#{b:socket_path}' '#{pane_current_path}' --safe --once" } { select-window -t = } }

# Resize panes (status panel width, diff height): C-a then arrow keys (repeat the arrow within 600 ms without C-a)
set -g repeat-time 600
bind -r Left resize-pane -L 3
bind -r Right resize-pane -R 3
bind -r Up resize-pane -U 2
bind -r Down resize-pane -D 2
# C-a d: collapse the diff pane to 6 rows / expand it again. C-a w: save this tab's status panel width and
# diff height as the defaults (~/.config/cc-panel/config). C-a D detaches (d is taken).
bind d run-shell -b "'#{@ccx_home}/togglediff.sh' '#{b:socket_path}' '#{window_id}'"
bind w run-shell -b "'#{@ccx_home}/savesize.sh' '#{b:socket_path}' '#{window_id}'"
bind D detach-client
# Nested in another tmux: keep the outer window named "ccx · <active tab>" (no-op otherwise, see outer-title.sh)
set-hook -g session-window-changed "run-shell -b \"'#{@ccx_home}/outer-title.sh' '#{b:socket_path}'\""
set-hook -g window-renamed "run-shell -b \"'#{@ccx_home}/outer-title.sh' '#{b:socket_path}'\""
set-hook -g window-unlinked "run-shell -b \"'#{@ccx_home}/outer-title.sh' '#{b:socket_path}'\""
# Select panes: C-a h/j/k/l (arrows now resize), C-a o, or the mouse
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
