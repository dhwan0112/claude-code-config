# tmux config for the ccx server only (tmux -L cc -f ~/.claude/cc-panel/tmux.conf).
# Does not affect the default tmux server or ~/.tmux.conf.

# Prefix C-a; press C-a twice to send a literal C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g escape-time 10
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g automatic-rename off
set -g focus-events on

# Tabs on top
set -g status-position top
set -g status-interval 2
set -g status-style "bg=colour236,fg=colour248"
set -g status-left "#[bg=colour31,fg=colour255,bold] ccx #[default] "
set -g status-left-length 12
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=colour254,fg=colour235,bold] #I #W #[default]"
set -g window-status-separator "#[fg=colour240]│#[default]"
set -g status-right "#[fg=colour244]C-a: c new · n/p tab · z zoom · ←↑↓→ size · hjkl pane · C-a=C-a "
set -g status-right-length 80

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"

# New tab = new Claude Code session in the current pane's directory
bind c run-shell -b "cd '#{pane_current_path}' && CCX_SOCKET=#{b:socket_path} CCX_NO_ATTACH=1 CCX_SELECT=1 ~/.local/bin/ccx >/dev/null 2>&1"

# Resize panes: C-a then arrow keys (repeat the arrow within 600 ms without C-a)
set -g repeat-time 600
bind -r Left resize-pane -L 3
bind -r Right resize-pane -R 3
bind -r Up resize-pane -U 2
bind -r Down resize-pane -D 2
# Select panes: C-a h/j/k/l (arrows now resize), C-a o, or the mouse
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
